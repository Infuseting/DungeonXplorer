name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      packages: read
    
    steps:
      - name: Pull and Restart Docker Container
        shell: bash {0}
        run: |
          echo "=== Starting deployment ==="
          echo "Current directory: $(pwd)"
          
          echo "=== Step 1: Changing to docker directory ==="
          cd /home/infuseting/docker/
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to change directory"
            exit 1
          fi
          echo "Success! Now in: $(pwd)"
          
          echo "=== Step 2: Logging into GHCR ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if [ $? -ne 0 ]; then
            echo "ERROR: Docker login failed"
            exit 1
          fi
          echo "Success! Logged into GHCR"
          
          echo "=== Step 3: Pulling latest image ==="
          docker compose pull dungeonxplorer
          if [ $? -ne 0 ]; then
            echo "ERROR: Docker compose pull failed"
            exit 1
          fi
          echo "Success! Image pulled"
          
          echo "=== Step 4: Restarting container ==="
          docker compose up -d dungeonxplorer
          if [ $? -ne 0 ]; then
            echo "ERROR: Docker compose up failed"
            exit 1
          fi
          echo "Success! Container restarted"
          
          echo "=== Deployment completed successfully! ==="
