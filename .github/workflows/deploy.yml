name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      packages: read
    
    steps:
      - name: Pull and Restart Docker Container
        run: |
          set -x
          echo "Current directory: $(pwd)"
          echo "Changing to docker directory..."
          cd /home/infuseting/docker/ || { echo "Failed to cd"; exit 1; }
          echo "Current directory after cd: $(pwd)"
          
          echo "Logging into GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || { echo "Docker login failed"; exit 1; }
          
          echo "Pulling image..."
          docker compose pull dungeonxplorer || { echo "Docker compose pull failed"; exit 1; }
          
          echo "Restarting container..."
          docker compose up -d dungeonxplorer || { echo "Docker compose up failed"; exit 1; }
          
          echo "Deployment successful!"
